name: bitquest-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

  steps:
    - name: checkout repository
      uses: actions/checkout@v3

    - name: setup node
      uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: npm
    - name: install dependencies
      run: npm ci
    
    - name: verify application
      run: npm run verify


